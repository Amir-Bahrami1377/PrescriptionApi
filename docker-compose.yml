services:
  postgres:
    image: postgres:16-alpine
    container_name: prescription-postgres
    environment:
      POSTGRES_DB: prescription_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - prescription-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d prescription_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: prescription-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: prescription-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console (dev only)
    volumes:
      - prescription-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prescription-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=prescription_db;Username=postgres;Password=postgres"
      ConnectionStrings__Redis: "redis:6379"
      MinIO__Endpoint: "minio:9000"
      # Presigned URLs are handed to browsers outside the compose network, so they must point at
      # the published host port ("minio:9000" only resolves inside the Docker network).
      MinIO__PublicEndpoint: "localhost:9000"
      MinIO__AccessKey: "minioadmin"
      MinIO__SecretKey: "minioadmin"
      MinIO__UseSsl: "false"
      # Jwt__SigningKey / ColumnEncryption__Key / MeliPayamak__* / ZarinPal__* are dev-only
      # defaults baked into appsettings.Development.json; override them here for anything
      # beyond local development.
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  prescription-postgres-data:
  prescription-minio-data:
