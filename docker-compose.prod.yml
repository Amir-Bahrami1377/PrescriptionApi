# Deployment compose file. Unlike docker-compose.yml (which builds from source and leans on the
# dev defaults baked into appsettings.Development.json), this runs the image published by CI and
# takes every secret from the environment — the deploy job writes them into a .env file next to
# this one on the server.
services:
  postgres:
    image: postgres:16-alpine
    container_name: prescription-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-prescription_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - prescription-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-prescription_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: prescription-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: prescription-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    # No published ports: reachable only through Caddy, which fronts it with TLS. The admin console
    # on 9001 stays off the internet entirely.
    volumes:
      - prescription-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    # Written by the deploy job as the exact immutable tag that passed CI, never :latest, so a
    # restart on the server can't silently pull a different build than the one that was deployed.
    image: ${API_IMAGE:?API_IMAGE is required}
    container_name: prescription-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Production skips the Development startup path, so migrations need this explicit opt-in.
      Database__MigrateOnStartup: "true"
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-prescription_db};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__Redis: "redis:6379"
      # Bootstraps the account that can open the admin panel. Required rather than optional: losing
      # it on a fresh database would leave the deployment with no way in. Applied on every startup,
      # so this number is always an admin — demote it from the panel and a restart restores it.
      Seed__AdminPhoneNumber: ${SEED_ADMIN_PHONE_NUMBER:?SEED_ADMIN_PHONE_NUMBER is required}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY is required}
      ColumnEncryption__Key: ${COLUMN_ENCRYPTION_KEY:?COLUMN_ENCRYPTION_KEY is required}
      MinIO__Endpoint: "minio:9000"
      # Presigned URLs are opened by the patient's browser, so they must carry a host reachable
      # from outside this network — see MinioFileStorageService.
      MinIO__PublicEndpoint: ${MINIO_PUBLIC_ENDPOINT:?MINIO_PUBLIC_ENDPOINT is required}
      MinIO__AccessKey: ${MINIO_ACCESS_KEY}
      MinIO__SecretKey: ${MINIO_SECRET_KEY}
      MinIO__UseSsl: ${MINIO_USE_SSL:-false}
      ZarinPal__MerchantId: ${ZARINPAL_MERCHANT_ID:?ZARINPAL_MERCHANT_ID is required}
      MeliPayamak__Username: ${MELIPAYAMAK_USERNAME:?MELIPAYAMAK_USERNAME is required}
      MeliPayamak__Password: ${MELIPAYAMAK_PASSWORD:?MELIPAYAMAK_PASSWORD is required}
      MeliPayamak__BodyId: ${MELIPAYAMAK_BODY_ID:?MELIPAYAMAK_BODY_ID is required}
      MeliPayamak__SenderNumber: ${MELIPAYAMAK_SENDER_NUMBER:?MELIPAYAMAK_SENDER_NUMBER is required}
    # Deliberately no published ports. Caddy is the only way in, which is also what makes clearing
    # KnownProxies in Program.cs safe — nothing else is positioned to forge X-Forwarded-* headers.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2-alpine
    container_name: prescription-caddy
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?PUBLIC_DOMAIN is required}
      FILES_DOMAIN: ${FILES_DOMAIN:?FILES_DOMAIN is required}
      # Let's Encrypt uses this to warn about renewal problems before a certificate lapses.
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Issued certificates live here. Without this volume every restart would request new ones and
      # run into Let's Encrypt's rate limit before long.
      - prescription-caddy-data:/data
      - prescription-caddy-config:/config

volumes:
  prescription-postgres-data:
  prescription-minio-data:
  prescription-caddy-data:
  prescription-caddy-config:
